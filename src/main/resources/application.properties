spring.application.name=banking-backend

# PostgreSQL (Neon) datasource.
# Recommended: set environment variables SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD.
# This project also supports DB_URL/DB_USERNAME/DB_PASSWORD and DATABASE_URL (postgresql://...).
# Example JDBC URL: jdbc:postgresql://<host>/<db>?sslmode=require
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:${JDBC_DATABASE_URL:}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${JDBC_DATABASE_USERNAME:}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${JDBC_DATABASE_PASSWORD:}}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
# For a fresh DB without migrations yet, you can set JPA_DDL_AUTO=update temporarily.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:1}
spring.flyway.validate-on-migrate=${FLYWAY_VALIDATE_ON_MIGRATE:true}

# Auth (JWT)
# Provide a strong secret via env var JWT_SECRET (>= 32 chars). Do not commit secrets.
app.jwt.secret=${JWT_SECRET:dev-only-jwt-secret-change-me-please-32-chars}
app.jwt.issuer=${JWT_ISSUER:minibank}
app.jwt.access-token-ttl-seconds=${JWT_ACCESS_TOKEN_TTL_SECONDS:86400}

# OTP (dev only)
app.otp.debug-return=${OTP_DEBUG_RETURN:false}

# SMS Configuration
# Set to true for development to use hardcoded OTP "123456"
sms.dev-mode=${SMS_DEV_MODE:true}
sms.twilio-account-sid=${TWILIO_ACCOUNT_SID:placeholder}
sms.twilio-auth-token=${TWILIO_AUTH_TOKEN:placeholder}
sms.twilio-verify-service-sid=${TWILIO_VERIFY_SERVICE_SID:placeholder}

